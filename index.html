</style></head><body><main class="app"><header class="top"><div class="brand"><div class="logo">✦</div><div>God<span style="color:#b6fb55">Fit</span><div class="sub" style="font-size:11px;font-weight:500;letter-spacing:0">STRONGER EVERY SESSION</div></div></div><button class="avatar" onclick="navigate('settings')">⚙</button></header><div id="view"></div></main><nav class="nav"><div class="nav-inner"><button id="nav-home" onclick="navigate('home')"><span class="ico">⌂</span>Home</button><button id="nav-plan" onclick="navigate('plan')"><span class="ico">▦</span>Plan</button><button id="nav-progress" onclick="navigate('progress')"><span class="ico">▥</span>Progress</button><button id="nav-coach" onclick="navigate('coach')"><span class="ico">✧</span>AI Coach</button><button id="nav-settings" onclick="navigate('settings')"><span class="ico">⚙</span>Settings</button></div></nav><div class="toast" id="toast"></div><script>
const MOVES={leg_press:{name:'Leg Press',muscle:'Quads · Glutes',icon:'🦵',steps:['Adjust the seat so your knees are comfortably bent at the bottom.','Keep your entire foot planted; push through midfoot and heel.','Extend without locking your knees; lower slowly and keep your lower back supported.'],tips:'Do not let your knees collapse inward.'},chest_press:{name:'Machine Chest Press',muscle:'Chest · Triceps',icon:'🏋️',steps:['Adjust the seat so handles are around mid-chest level.','Keep shoulders back and feet stable.','Press smoothly and return with control.'],tips:'Avoid shrugging your shoulders.'},lat_pulldown:{name:'Lat Pulldown',muscle:'Lats · Upper back',icon:'↧',steps:['Sit with your thighs secured under the pads.','Pull the bar toward your upper chest while driving your elbows down.','Control the return overhead without leaning far backward.'],tips:'Do not pull behind your neck.'},leg_curl:{name:'Seated / Lying Leg Curl',muscle:'Hamstrings',icon:'🦵',steps:['Align the machine pivot with your knee joint.','Secure the pads and bend your knees to curl the weight.','Pause briefly, then return slowly.'],tips:'Keep hips firmly against the pad.'},shoulder_press:{name:'Machine Shoulder Press',muscle:'Shoulders',icon:'⬆',steps:['Adjust the seat so handles begin near shoulder height.','Brace your core and press upward without excessive arching.','Lower slowly until comfortable.'],tips:'Use a pain-free range of motion.'},cable_crunch:{name:'Cable Crunch',muscle:'Abdominals',icon:'◉',steps:['Kneel at a high cable with a rope near your head.','Curl your ribs toward your pelvis using your abs.','Return slowly without relying on hip motion.'],tips:'Use a light weight and keep hips relatively stable.'},leg_extension:{name:'Leg Extension',muscle:'Quads',icon:'🦵',steps:['Align knees with the machine pivot and set the shin pad above your ankles.','Straighten knees in a controlled motion.','Lower slowly without swinging.'],tips:'Use a comfortable range of motion.'},seated_row:{name:'Seated Cable Row',muscle:'Mid-back · Biceps',icon:'↤',steps:['Sit tall with a neutral spine and reach for the handle.','Pull elbows back while bringing the handle toward your lower ribs.','Extend arms slowly without rounding excessively.'],tips:'Do not jerk with your torso.'},incline_press:{name:'Incline Machine Chest Press',muscle:'Upper chest · Triceps',icon:'🏋️',steps:['Set seat and handles at upper-chest level.','Press forward and upward through a comfortable range.','Lower steadily, keeping shoulders supported.'],tips:'Do not flare elbows excessively.'},hip_thrust:{name:'Hip Thrust Machine',muscle:'Glutes',icon:'◢',steps:['Place your upper back or hips against the machine support as designed.','Push through heels to raise hips, keeping ribs down.','Squeeze glutes at the top, then lower with control.'],tips:'Avoid overextending your lower back.'},biceps:{name:'Cable Biceps Curl',muscle:'Biceps',icon:'💪',steps:['Stand tall, elbows near your sides, hold low cable handle.','Curl without swinging your upper arms.','Lower with control.'],tips:'Avoid leaning backward.'},triceps:{name:'Cable Triceps Pushdown',muscle:'Triceps',icon:'💪',steps:['Face a high cable and keep elbows by your ribs.','Straighten your elbows to push the handle down.','Return slowly with upper arms still.'],tips:'Avoid shoulder swinging.'},plank:{name:'Plank',muscle:'Core',icon:'▬',steps:['Put elbows directly under your shoulders.','Hold your body in a straight line and brace your abs.','Breathe steadily without letting hips sag.'],tips:'Stop when you cannot maintain a neutral spine.'},pec_deck:{name:'Pec Deck Fly',muscle:'Chest',icon:'◇',steps:['Adjust seat so handles are around chest height.','Bring arms together in front without shrugging.','Open slowly without stretching too far.'],tips:'Use controlled motion, not momentum.'},lateral_raise:{name:'Dumbbell Lateral Raise',muscle:'Side delts',icon:'↟',steps:['Stand tall with a light dumbbell in each hand.','Raise arms out to your sides up to shoulder level.','Lower slowly with slightly bent elbows.'],tips:'Avoid swinging heavy weights.'},abs_machine:{name:'Ab Crunch Machine',muscle:'Abdominals',icon:'◉',steps:['Set machine to your height and secure the pads.','Curl your torso with your abs rather than pulling with your arms.','Return slowly, keeping motion controlled.'],tips:'Do not use momentum.'}};
const DEFAULT_PROGRAM={name:'GodFit Full Body · 3 Days',days:[{id:'A',name:'Full Body A',focus:'Chest · Legs · Back · Core',exercises:[['leg_press',3,12,90],['chest_press',3,10,90],['lat_pulldown',3,12,90],['leg_curl',2,12,60],['shoulder_press',2,10,90],['cable_crunch',3,12,60]]},{id:'B',name:'Full Body B',focus:'Back · Legs · Arms · Core',exercises:[['leg_extension',3,12,60],['seated_row',3,12,90],['incline_press',3,10,90],['hip_thrust',2,12,90],['biceps',2,12,60],['triceps',2,12,60],['plank',3,30,45]]},{id:'C',name:'Full Body C',focus:'Total Body · Shoulders · Core',exercises:[['leg_press',3,12,90],['pec_deck',2,12,60],['lat_pulldown',3,10,90],['leg_curl',3,12,60],['lateral_raise',2,12,60],['biceps',2,12,60],['abs_machine',3,15,60]]}]};
const PHASES={
 A:{warm:[['Easy treadmill or bike','5 min · Start at a conversational pace.'],['Leg press preparation','1 × 12 light reps · Lower slowly; do not lock knees.'],['Chest press preparation','1 × 10 light reps · Adjust seat and move through a comfortable range.'],['Pulldown preparation','1 × 10 light reps · Pull elbows toward ribs.']],cool:[['Easy walking','3–5 min · Gradually slow your breathing.'],['Standing quadriceps stretch','20–30 sec per side · Gentle, no bouncing.'],['Doorway chest stretch','20–30 sec per side · Stay pain-free.'],['Relaxed breathing','1 min · Slow, comfortable breaths.']]},
 B:{warm:[['Easy bike or elliptical','5 min · Light effort.'],['Hip hinges without weight','1 × 10 · Move hips backward with a neutral spine.'],['Light seated rows','1 × 12 · Squeeze shoulder blades gently.'],['Light incline chest press','1 × 10 · Prepare shoulders before work sets.']],cool:[['Easy walking','3–5 min · Decrease the pace gradually.'],['Hip flexor stretch','20–30 sec per side · Keep torso upright.'],['Upper back stretch','20–30 sec · Relax the shoulders.'],['Relaxed breathing','1 min · Return to comfortable breathing.']]},
 C:{warm:[['Easy treadmill or bike','5 min · Conversational pace.'],['Bodyweight chair squats','1 × 10 · Keep feet stable.'],['Light pulldowns','1 × 12 · Controlled shoulder movement.'],['Shoulder circles','30 sec each direction · Easy pain-free movements.']],cool:[['Easy walking','3–5 min · Slow down gradually.'],['Seated hamstring stretch','20–30 sec per side · No bouncing.'],['Gentle shoulder stretch','20–30 sec per side · Pain-free range.'],['Relaxed breathing','1 min · Allow heart rate to settle.']]}
};
const UNIVERSAL_PHASES={warm:[['Easy cardio','5 minutes · Walk or cycle gently.'],['Dynamic mobility','2 minutes · Move joints through a comfortable range.'],['Light warm-up sets','1–2 sets for the first major exercise; increase weight gradually.']],cool:[['Easy cardio','3–5 minutes · Gradually slow down.'],['Gentle stretching','2–3 minutes · Focus on muscles trained today.'],['Easy breathing','1 minute · Relax and rehydrate.']]};
function phasesFor(d){return PHASES[d.id]||UNIVERSAL_PHASES}
function phaseBlock(phase,d,mode){let isWarm=phase==='warm',data=phasesFor(d)[phase],flags=mode==='workout'?(state.active?.phases?.[phase]||[]):[];return `<section class="phase ${isWarm?'':'cool'}"><div class="phasehead"><div><div class="eyebrow">${isWarm?'BEFORE YOUR WORKOUT':'AFTER YOUR WORKOUT'}</div><h3>${isWarm?'🔥 Warm-up':'🧘 Cool-down'}</h3></div><span class="phasebadge">${isWarm?'7–10 MIN':'5–8 MIN'}</span></div><p class="phasehint">${isWarm?'Prepare muscles and joints; these are not heavy working sets.':'Cool down gradually; stretching should feel gentle, never painful.'}</p>${mode==='workout'?data.map(([title,desc],i)=>`<label class="phaseitem ${flags[i]?'checked':''}"><input type="checkbox" ${flags[i]?'checked':''} onchange="togglePhase('${phase}',${i},this.checked)"><span><strong>${esc(title)}</strong><small>${esc(desc)}</small></span></label>`).join(''):`<details><summary>View ${data.length} steps ↓</summary>${data.map(([title,desc],i)=>`<div class="phaseitem"><span>${i+1}.</span><span><strong>${esc(title)}</strong><small>${esc(desc)}</small></span></div>`).join('')}</details>`}</section>`}
function togglePhase(phase,i,value){if(!state.active)return;state.active.phases??={warm:[],cool:[]};state.active.phases[phase]??=[];state.active.phases[phase][i]=value;save();render()}
async function enableWatchAlerts(){if(!('Notification' in window)||!('serviceWorker' in navigator)){alert('Notifications are not available here. Install GodFit to your iPhone Home Screen and open it from there.');return}try{const permission=await Notification.requestPermission();if(permission==='granted'){localStorage.setItem('godfit_rest_alerts','on');toast('Rest alerts enabled');}else toast('Notification permission not granted')}catch(e){alert('Notifications unavailable: '+e.message)}render()}
async function notifyRestDone(){if(localStorage.getItem('godfit_rest_alerts')!=='on'||!('Notification'in window)||Notification.permission!=='granted')return;try{let reg=await navigator.serviceWorker.ready;await reg.showNotification('GodFit · Rest complete',{body:'Your rest timer is over. Ready for the next set?',icon:'./icon.svg',tag:'godfit-rest',renotify:true})}catch(e){console.warn('Rest notification failed',e)}}
const KEY='godfit_v1';const deep=o=>JSON.parse(JSON.stringify(o));let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||typeof state!=='object')state={};state.program??=deep(DEFAULT_PROGRAM);state.history??=[];state.measurements??=[];state.active??=null;state.selected??='A';let page='home',detail=null,restEnds=0,tick=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(state))}function toast(t){let el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(window.toastDelay);window.toastDelay=setTimeout(()=>el.style.display='none',2600)}function datefmt(v){return new Date(v).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}function navActive(p){for(const n of ['home','plan','progress','coach','settings'])document.getElementById('nav-'+n).classList.toggle('active',n===p)}function navigate(p){page=p;detail=null;render();scrollTo(0,0)}function day(){return state.program.days.find(d=>d.id===state.selected)||state.program.days[0]}function prevWeight(id){for(const h of [...state.history].reverse())for(const e of h.exercises||[])if(e.id===id){const val=e.sets?.find(s=>s.done&&s.kg!=='');if(val)return val.kg}return ''}function activePercent(){if(!state.active)return 0;let sets=state.active.exercises.flatMap(e=>e.sets);return sets.length?Math.round(sets.filter(s=>s.done).length/sets.length*100):0}
function render(){navActive(page);let el=document.getElementById('view');if(page==='home')el.innerHTML=home();if(page==='plan')el.innerHTML=plan();if(page==='workout')el.innerHTML=workout();if(page==='exercise')el.innerHTML=exercise();if(page==='progress')el.innerHTML=progress();if(page==='coach')el.innerHTML=coach();if(page==='settings')el.innerHTML=settings();if(restEnds>0)updateTimer();}function latest(){return state.history.at(-1)}function home(){let d=day(),n=state.history.length;return `<div class="date">${esc(new Date().toLocaleDateString('en-GB',{weekday:'long',month:'long',day:'numeric'}))}</div><section class="hero"><div class="eyebrow">YOUR FITNESS JOURNEY</div><h1>Build strength.<br><span style="color:#b6fb55">Beat yesterday.</span></h1><p>Personal full-body training, simple progression, and a stronger you — one session at a time.</p><button class="mainbtn" onclick="navigate('workout')">${state.active?'Resume workout':'Start '+esc(d.name)} →</button></section><div class="section"><h2>At a glance</h2><span class="pill">YOUR STATS</span></div><div class="stats"><div class="stat"><small>Workouts</small><strong>${n}</strong><small>completed</small></div><div class="stat"><small>This week</small><strong>${state.history.filter(h=>Date.now()-new Date(h.ended)<7*86400000).length}</strong><small>sessions</small></div><div class="stat"><small>Last session</small><strong style="font-size:16px">${latest()?datefmt(latest().ended):'—'}</strong><small>${latest()?esc(latest().name):'Ready to start'}</small></div></div><div class="section"><h2>Your training split</h2><a class="link" href="#" onclick="event.preventDefault();navigate('plan')">View all</a></div><div class="list">${state.program.days.map(d=>`<div class="movement" onclick="chooseDay('${esc(d.id)}')"><div class="glyph">${d.id==='A'?'🟢':d.id==='B'?'🔵':'🟣'}</div><div><div class="name">${esc(d.name)}</div><small>${d.exercises.length} exercises · ${esc(d.focus||'Full body')}</small></div><div class="arrow">›</div></div>`).join('')}</div><p class="footer-note">Suggested schedule: 3 non-consecutive days each week. Start with moderate weights, leaving 2–3 good reps in reserve.</p>`}
function chooseDay(id){state.selected=id;save();navigate('plan')}function plan(){return `<div class="eyebrow">YOUR PROGRAM</div><div class="workout-title">${esc(state.program.name)}</div><p class="muted">Full-body sessions · beginner-friendly machines · warm-up and cool-down included</p><div class="tabs">${state.program.days.map(d=>`<button class="${d.id===state.selected?'active':''}" onclick="chooseDay('${esc(d.id)}')">${esc(d.name)}</button>`).join('')}</div><div class="card"><div class="eyebrow">TODAY'S FOCUS</div><h3 style="margin-top:9px">${esc(day().focus||'Full body')}</h3><p class="muted tiny">Follow the warm-up below. Rest 60–90 seconds between working sets. Finish with the cool-down checklist.</p><button class="mainbtn" onclick="navigate('workout')">${state.active?'Resume Workout':'Start Workout'}</button></div>${phaseBlock('warm',day(),'plan')}<div class="section"><h2>Exercises</h2><span class="pill">${day().exercises.length} MOVES</span></div><div class="list">${day().exercises.map(([id,sets,reps],i)=>{let e=MOVES[id]||{name:id,muscle:'Strength',icon:'🏋️'};return `<div class="movement" onclick="openExercise('${esc(id)}')"><div class="glyph">${e.icon}</div><div><div class="name">${i+1}. ${esc(e.name)}</div><small>${sets} sets × ${reps}${id==='plank'?' sec':' reps'} · ${esc(e.muscle)}</small></div><div class="arrow">›</div></div>`}).join('')}</div>${phaseBlock('cool',day(),'plan')}` }function openExercise(id,returnPage=page){detail={id,returnPage};page='exercise';render();scrollTo(0,0)}function exercise(){let id=detail?.id,e=MOVES[id]||{name:id,muscle:'Strength',steps:['Follow safe technique and use a controlled range of motion.'],tips:''};let q=encodeURIComponent(e.name+' proper form gym exercise demonstration');return `<button class="outline" onclick="navigate('${detail?.returnPage==='workout'?'workout':'plan'}')">← Back</button><h2 class="workout-title">${esc(e.name)}</h2><p class="muted">${esc(e.muscle)}</p><div class="video"><div class="big">▶</div><h3>Video demonstration</h3><p class="tiny">Find technique videos for this movement on YouTube.</p><a href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">Watch exercise videos ↗</a></div><div class="section"><h2>How to do it</h2></div><div class="card"><ol class="guide">${(e.steps||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="warning">⚠ ${esc(e.tips||'Use a comfortable range of motion and stop if you feel pain.')}</div></div><p class="footer-note">Video links open a YouTube search, not a pre-verified tutorial. Only use demonstrations that match your exact machine setup.</p>`}
function startWorkout(){if(state.active)return;let d=day();state.active={id:d.id,name:d.name,started:new Date().toISOString(),phases:{warm:[],cool:[]},exercises:d.exercises.map(([id,num,reps,rest])=>({id,rest,sets:Array.from({length:num},()=>({kg:prevWeight(id),reps,done:false}))}))};save()}function workout(){startWorkout();let w=state.active,p=activePercent();return `<div class="eyebrow">WORKOUT IN PROGRESS</div><div class="workout-title">${esc(w.name)}</div><div class="muted">${p}% complete · ${w.exercises.reduce((v,e)=>v+e.sets.filter(s=>s.done).length,0)} finished sets</div><div class="progressline"><div style="width:${p}%"></div></div><div id="timerSlot">${restEnds?timerHTML():''}</div>${phaseBlock('warm',state.program.days.find(d=>d.id===w.id)||{id:w.id},'workout')}${w.exercises.map((ex,idx)=>{let e=MOVES[ex.id]||{name:ex.id,muscle:'Strength',icon:'🏋️'};return `<div class="card"><div style="display:flex;gap:10px;align-items:center;justify-content:space-between"><div><div class="eyebrow">EXERCISE ${idx+1}/${w.exercises.length}</div><h3 style="margin:6px 0 2px">${esc(e.name)}</h3><div class="muted tiny">${esc(e.muscle)} · Last used: ${esc(prevWeight(ex.id)||'—')} kg</div></div><button class="tog" onclick="openExercise('${esc(ex.id)}','workout')">▶ Guide</button></div><div class="setrow" style="margin-top:15px"><span></span><span class="tiny">KG</span><span class="tiny">REPS${ex.id==='plank'?' / SEC':''}</span><span class="tiny">DONE</span></div>${ex.sets.map((s,j)=>`<div class="setrow"><span class="n">${j+1}</span><input aria-label="Weight for set ${j+1}" type="number" min="0" step="0.5" placeholder="kg" value="${esc(s.kg)}" onchange="setValue(${idx},${j},'kg',this.value)"><input aria-label="Reps for set ${j+1}" type="number" min="0" value="${esc(s.reps)}" onchange="setValue(${idx},${j},'reps',this.value)"><button aria-label="Complete set" class="${s.done?'done':''}" onclick="setDone(${idx},${j})">${s.done?'✓':'○'}</button></div>`).join('')}</div>`}).join('')}${phaseBlock('cool',state.program.days.find(d=>d.id===w.id)||{id:w.id},'workout')}<button class="mainbtn" onclick="finishWorkout()">Finish & Save Workout ✓</button><button class="outline" style="width:100%;margin-top:10px" onclick="cancelWorkout()">Discard workout</button>`}function setValue(i,j,k,v){state.active.exercises[i].sets[j][k]=k==='reps'?Math.max(0,parseInt(v)||0):v===''?'':Math.max(0,Number(v)||0);save()}function setDone(i,j){let s=state.active.exercises[i].sets[j];s.done=!s.done;if(s.done){restEnds=Date.now()+state.active.exercises[i].rest*1000;ensureTick()}save();render()}function timerHTML(){return `<div class="timer"><div><small>REST TIMER</small><br><strong id="clock">${formatTime(Math.max(0,Math.ceil((restEnds-Date.now())/1000)))}</strong></div><button onclick="stopTimer()">Skip</button></div>`}function formatTime(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function ensureTick(){clearInterval(tick);tick=setInterval(updateTimer,300)}function updateTimer(){let slot=document.getElementById('timerSlot');if(!slot)return;let v=Math.max(0,Math.ceil((restEnds-Date.now())/1000));if(v<=0){restEnds=0;slot.innerHTML='';clearInterval(tick);notifyRestDone();return}if(!document.getElementById('clock'))slot.innerHTML=timerHTML();else document.getElementById('clock').textContent=formatTime(v)}function stopTimer(){restEnds=0;clearInterval(tick);render()}function finishWorkout(){let w=state.active;if(!w)return;let count=w.exercises.flatMap(e=>e.sets).filter(s=>s.done).length;if(!count){toast('Complete at least one set first');return}w.ended=new Date().toISOString();state.history.push(w);state.active=null;restEnds=0;save();toast('Workout saved!');navigate('progress')}function cancelWorkout(){if(confirm('Discard this workout?')){state.active=null;restEnds=0;save();navigate('home')}}
function progress(){let h=state.history,latest=state.measurements.at(-1);let series=h.map((w,i)=>({i:i+1,total:w.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).reduce((b,s)=>b+(Number(s.kg)||0)*(Number(s.reps)||0),0),0)}));let max=Math.max(1,...series.map(e=>e.total));let pts=series.map((e,i)=>`${36+(i/Math.max(1,series.length-1))*320},${145-e.total/max*114}`).join(' ');let chart=series.length?`<svg id="chart" viewBox="0 0 380 165" role="img" aria-label="Training volume over sessions"><line x1="34" y1="145" x2="366" y2="145" stroke="#6e7b92"/><line x1="34" y1="22" x2="34" y2="145" stroke="#6e7b92"/><polyline points="${pts}" fill="none" stroke="#b6fb55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${series.map((e,i)=>`<circle cx="${36+(i/Math.max(1,series.length-1))*320}" cy="${145-e.total/max*114}" r="4" fill="#b6fb55"/>`).join('')}<text x="35" y="160" fill="#929db3" font-size="10">Session 1</text><text x="300" y="160" fill="#929db3" font-size="10">Latest</text></svg>`:'<p class="muted">Complete a workout to see your progress chart.</p>';return `<div class="eyebrow">PERSONAL RECORD</div><h2 class="workout-title">Your progress</h2><div class="stats"><div class="stat"><small>Sessions</small><strong>${h.length}</strong></div><div class="stat"><small>Body weight</small><strong>${latest?.weight??'—'}</strong><small>kg</small></div><div class="stat"><small>Waist</small><strong>${latest?.waist??'—'}</strong><small>cm</small></div></div><div class="section"><h2>Training volume</h2></div><div class="card">${chart}<p class="tiny muted">Completed sets × reps × weight (kg). This measures logged training volume, not calories or muscle gain.</p></div><div class="section"><h2>Body measurements</h2></div><div class="card"><div class="two"><label class="field">Weight (kg)<input id="weight" type="number" min="0" step="0.1" placeholder="70" value="${esc(latest?.weight??'')}"></label><label class="field">Waist (cm)<input id="waist" type="number" min="0" step="0.1" placeholder="Optional" value="${esc(latest?.waist??'')}"></label></div><button class="mainbtn" onclick="saveMeasure()">Save measurement</button></div><div class="section"><h2>Workout history</h2></div><div class="list">${[...h].reverse().map(w=>`<div class="movement"><div class="glyph">✓</div><div><div class="name">${esc(w.name)}</div><small>${datefmt(w.ended)} · ${w.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0)} completed sets</small></div></div>`).join('')||'<p class="muted">Your completed workouts will appear here.</p>'}</div><p class="footer-note">Your records remain in this browser. Export a backup regularly; deleting website data may erase them.</p>`}function saveMeasure(){let w=document.getElementById('weight').value,wa=document.getElementById('waist').value;if(!w&&!wa){toast('Enter at least one value');return}state.measurements.push({date:new Date().toISOString(),weight:w===''?null:Number(w),waist:wa===''?null:Number(wa)});save();toast('Measurements saved');render()}
function askPrompt(){return `I use GodFit, an English-language personal fitness tracker. I'm approximately 70 kg and 169 cm, aiming for gradual muscle gain and less abdominal fat. I prefer beginner-friendly full-body gym sessions, mostly machines, 3 non-consecutive days a week, moderate intensity. My current plan is: ${JSON.stringify(state.program)}. My recent logged workouts are: ${JSON.stringify(state.history.slice(-5))}. Please adapt my next training plan based on this history, and return (1) concise exercise guidance and (2) a JSON object that GodFit can import, with EXACT schema: {"name":"Program title","days":[{"id":"A","name":"Full Body A","focus":"...","exercises":[["leg_press",3,12,90]]}]}. Allowed exercise IDs only: ${Object.keys(MOVES).join(', ')}. Each exercise array must be [exerciseId, numberOfSets, targetRepsOrSeconds, restSeconds]. No pain-provoking movements. Ask me for any essential missing information before changing load significantly.`}function coach(){return `<div class="eyebrow">YOUR PERSONAL COACH</div><h2 class="workout-title">Ask ChatGPT</h2><div class="card"><h3>Free, with your existing ChatGPT account</h3><p class="muted tiny">Open ChatGPT and paste a prepared message containing your plan and up to 5 recent workout logs. Then import the returned GodFit-compatible JSON. This is a handoff, not a live in-app AI connection.</p><button class="mainbtn" onclick="copyPrompt()">Copy my training request</button><button class="outline" style="width:100%;margin-top:10px" onclick="window.open('https://chatgpt.com/','_blank','noopener')">Open ChatGPT ↗</button></div><div class="section"><h2>Import a new training plan</h2></div><div class="card"><label class="field">Paste the JSON plan from ChatGPT<textarea id="planjson" placeholder='{"name":"New plan","days":[...]}'></textarea></label><button class="mainbtn" onclick="importProgram()">Validate & import plan</button><p class="tiny muted">Import replaces the current plan but keeps workout history. Only known exercises are accepted, so video search and technique notes remain available.</p></div><p class="footer-note">ChatGPT Plus doesn't include direct API usage. This workflow has no API fees and does not expose an API key.</p>`}async function copyPrompt(){let p=askPrompt();try{await navigator.clipboard.writeText(p);toast('Prompt copied — paste into ChatGPT')}catch(e){prompt('Copy this text:',p)}}function extractJSON(t){let a=t.indexOf('{'),b=t.lastIndexOf('}');return JSON.parse(t.slice(a,b+1))}function validateProgram(v){if(!v||typeof v.name!=='string'||!Array.isArray(v.days)||v.days.length<1||v.days.length>7)throw Error('Expected program name and 1–7 days');let ids=new Set();for(const d of v.days){if(!d||typeof d.id!=='string'||!/^[-\w]{1,24}$/.test(d.id)||ids.has(d.id)||typeof d.name!=='string'||!Array.isArray(d.exercises)||d.exercises.length<1||d.exercises.length>15)throw Error('Invalid workout day');ids.add(d.id);for(const e of d.exercises)if(!Array.isArray(e)||e.length!==4||!MOVES[e[0]]||!e.slice(1).every(x=>Number.isInteger(x)&&x>0&&x<=300))throw Error('Unknown exercise or invalid sets/reps/rest')}}function importProgram(){try{let p=extractJSON(document.getElementById('planjson').value);validateProgram(p);if(state.active)throw Error('Finish or discard your current workout first');state.program={name:p.name.slice(0,100),days:p.days.map(d=>({id:d.id,name:d.name.slice(0,80),focus:String(d.focus||'Full body').slice(0,100),exercises:d.exercises}))};state.selected=p.days[0].id;save();toast('New program imported!');navigate('plan')}catch(e){alert('Could not import: '+e.message)}}
function settings(){return `<div class="eyebrow">PERSONALIZE</div><h2 class="workout-title">Settings & data</h2><div class="card"><h3>Keep your progress safe</h3><p class="muted tiny">Data is saved locally on your device; there is no account or cloud sync. Export a backup, especially before changing phones or clearing Safari data.</p><button class="mainbtn" onclick="exportData()">↓ Export backup (.json)</button><label class="field" style="margin-top:15px">Restore a GodFit backup<input type="file" accept="application/json,.json" onchange="restoreFile(this.files[0])"></label></div><div class="card"><h3>Workout program</h3><p class="muted tiny">Restore the default 3-day full-body program. This keeps your completed workout history.</p><button class="outline" style="width:100%" onclick="resetProgram()">Restore default plan</button></div><div class="card"><h3>Rest-complete notifications · Experimental</h3><p class="tiny muted">Enable notifications from your installed iPhone Home Screen app. Apple Watch may mirror the alert when your iPhone is locked. This is an experimental best-effort alert: iOS can suspend browser timers in the background, so it is not reliable as a background alarm and cannot show a live countdown or completed sets on your watch.</p><button class="outline watchbtn" onclick="enableWatchAlerts()">${localStorage.getItem('godfit_rest_alerts')==='on'?'✓ Rest alerts enabled':'Enable rest alerts'}</button></div><div class="card"><h3>Apple Watch</h3><p class="tiny muted">This is a free iPhone web app. The timer works while the web app remains active. Rest-complete web notifications may mirror to Apple Watch after opt-in; this does not provide a live watch interface. Direct watchOS set logging and Apple Health integration require a native companion app.</p></div><div class="card"><h3>Technique videos</h3><p class="tiny muted">Exercise guides link to YouTube search results. Videos are not bundled or licensed for offline playback. Select a demonstration matching your equipment.</p></div><div class="footer-note">GodFit is a personal training tracker, not medical advice. Start conservatively; stop exercises that cause pain.</div>`}function exportData(){let blob=new Blob([JSON.stringify({app:'GodFit',version:1,...state},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='godfit-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restoreFile(f){if(!f)return;try{let v=JSON.parse(await f.text());if(v.app!=='GodFit'||!Array.isArray(v.history)||!Array.isArray(v.measurements))throw Error('Not a valid GodFit backup');validateProgram(v.program);if(!confirm('Replace all current GodFit data with this backup?'))return;state={program:v.program,history:v.history,measurements:v.measurements,active:null,selected:v.selected||v.program.days[0].id};save();toast('Backup restored');navigate('home')}catch(e){alert('Restore failed: '+e.message)}}function resetProgram(){if(confirm('Restore default workout plan? Workout logs will be kept.')){state.program=deep(DEFAULT_PROGRAM);state.selected='A';state.active=null;save();navigate('plan')}}if('serviceWorker'in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
